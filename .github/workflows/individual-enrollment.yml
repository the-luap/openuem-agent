name: Individual endpoint enrollment

on:
  pull_request:
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

jobs:
  linux-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Durable enrollment state and bounded HTTPS recovery
        run: go test -race -count=1 ./internal/enrollmentstore ./internal/agent ./internal/packagesignature ./internal/bootstrapinstall ./internal/enrollcommand ./internal/activatecommand ./internal/service/... ./internal/commands/sftp ./internal/runtimeoptions ./internal/macbundle ./internal/localready ./internal/macservice
      - name: Build the agent
        run: go build ./...

  mac-storage:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CGO_CFLAGS: '-mmacosx-version-min=13.0'
      CGO_CXXFLAGS: '-mmacosx-version-min=13.0'
      CGO_LDFLAGS: '-mmacosx-version-min=13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Isolated noninteractive keychain and separate process recovery
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -tags openuem_keychain_test ./internal/enrollmentstore ./internal/agent ./internal/packagesignature ./internal/bootstrapinstall ./internal/enrollcommand ./internal/activatecommand ./internal/service/... ./internal/commands/sftp ./internal/runtimeoptions ./internal/macbundle ./internal/localready ./internal/macservice
      - name: Root-only readiness over isolated native Unix sockets
        run: scripts/check-macos-readiness.sh
      - name: Root filesystem and read-only native activation fixtures
        run: scripts/check-macos-activation.sh
      - name: Build the agent with native keychain support
        env:
          CGO_ENABLED: '1'
        run: go build ./...
      - name: Build a draft app bundle from the actual agent without installing it
        run: scripts/check-macos-bundle.sh
      - name: Native enrollment help does not start the service
        run: |
          go run ./cmd/openuem-macos-bundle -help
          go run ./internal/service/mac enroll -help
          go run ./internal/service/mac serve -help
          go run ./internal/service/mac activate -help

  windows-storage:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Native DPAPI, private publication and Local System recovery
        run: go test -count=1 ./internal/enrollmentstore ./internal/agent ./internal/packagesignature ./internal/bootstrapinstall ./internal/enrollcommand ./internal/activatecommand ./internal/service/... ./internal/commands/sftp ./internal/runtimeoptions ./internal/macbundle ./internal/localready ./internal/macservice
      - name: Build the agent
        run: go build ./...
      - name: Native enrollment help does not start the service
        run: |
          go run ./internal/service/windows enroll -help
          go run ./internal/service/windows serve -help
          go run ./internal/service/windows activate -help
