name: Individual endpoint enrollment

on:
  pull_request:
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

jobs:
  windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 15
    env:
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          architecture: arm64
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Go 1.26 supports the Windows race detector only on AMD64; that job remains required.
      - name: Native ARM64 bounded cabinet callbacks
        run: go test -count=1 -timeout 2m ./internal/burnbundle
      - name: Native ARM64 protected staging and bounded cleanup without skips
        shell: pwsh
        run: scripts/check-windows-staging.ps1 -Architecture arm64
      - name: Native ARM64 Burn metadata and preflight without skips
        shell: pwsh
        run: scripts/check-windows-burn-format.ps1 -Architecture arm64
      - name: Native ARM64 owned Burn MSI execution and child lifetime without skips
        shell: pwsh
        run: scripts/check-windows-burn-execution.ps1 -Architecture arm64
      - name: Native ARM64 owned MSI install, major upgrade and removal without skips
        shell: pwsh
        run: scripts/check-windows-msi-execution.ps1 -Architecture arm64
      - name: Native ARM64 private readiness and joined shutdown without skips
        shell: pwsh
        run: scripts/check-windows-readiness.ps1 -Architecture arm64

  windows-readiness:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Join native named-pipe shutdown after disconnected clients without skips
        shell: pwsh
        run: scripts/check-windows-readiness.ps1

  windows-burn-execution:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install and remove only an owned Burn bundle with a generated registry-only MSI
        shell: pwsh
        run: scripts/check-windows-burn-execution.ps1
      - name: Native AMD64 protected staging and bounded cleanup without skips
        shell: pwsh
        run: scripts/check-windows-staging.ps1 -Architecture amd64

  windows-burn-format:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Read only bounded native cabinet data with isolated callbacks
        run: go test -race -count=1 ./internal/burnbundle
      - name: Inspect owned Burn bundles and require bounded native preflight without execution
        shell: pwsh
        run: scripts/check-windows-burn-format.ps1

  linux-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Cache dependencies before isolated native execution
        run: go mod download
      - name: Native Linux readiness, root peer credentials and joined shutdown
        run: scripts/check-linux-readiness.sh
      - name: Native systemd unit parsing and authenticated private manager transport
        run: scripts/check-linux-service-unit.sh
      - name: Native protected operational configuration and activation provider phases
        run: scripts/check-linux-activation.sh
      - name: Bounded literal Linux service paths
        # Fixed execution budgets avoid the Go 1.26 fuzz-duration cancellation
        # race: https://github.com/golang/go/issues/75804. Errors still fail CI.
        run: go test -run '^$' -fuzz '^FuzzUnitLiteralPaths$' -fuzztime=1000000x -timeout=5m -parallel=2 ./internal/linuxservice

  linux-systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Cache dependencies before isolated native execution
        run: go mod download
      - name: Actual PID-1 systemd in three owned RAM-only virtual machines
        run: scripts/check-linux-systemd.sh

  linux-native-enrollment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Cache dependencies before isolated native execution
        run: go mod download
      - name: Native Linux enrollment, encrypted recovery and independent publisher trust
        run: scripts/check-linux-enrollment.sh

  linux-running-executable:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Cache dependencies before isolated native execution
        run: go mod download
      - name: Kernel-bound Linux executable and signed release admission
        run: scripts/check-linux-executable.sh

  linux-package-signatures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Cache dependencies before isolated native execution
        run: go mod download
      - name: Native DEB and RPM publisher verification without installation
        run: scripts/check-linux-package-signatures.sh

  linux-credential-encryption:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Cache dependencies before isolated native execution
        run: go mod download
      - name: Native host-key credential encryption in an isolated Linux fixture
        run: scripts/check-linux-credential-encryption.sh

  linux-service-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Cache dependencies before isolated native execution
        run: go mod download
      - name: Native root and unprivileged process ownership in disposable Linux
        run: scripts/check-linux-service-ownership.sh

  linux-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Durable enrollment state and bounded HTTPS recovery
        run: go test -race -count=1 ./internal/enrollmentstore ./internal/agent ./internal/packagesignature ./internal/bootstrapinstall ./internal/enrollcommand ./internal/activatecommand ./internal/service/... ./internal/commands/sftp ./internal/commands/deploy ./internal/commands/netbird ./internal/netbirdjournal ./internal/netbirdinstall ./internal/commands/report ./internal/commands/runtime ./internal/runtimeoptions ./internal/macbundle ./internal/localready ./internal/macservice ./internal/machardware ./internal/macsecurity ./internal/windowssoftware ./internal/burnbundle
      - name: Build the agent
        run: go build ./...
      - name: Linux enrollment help exits before service startup
        run: go run ./internal/service/linux enroll -help
      - name: Bounded native installation receipt parsing
        # Keep one million executions per target instead of duration-based
        # cancellation affected by https://github.com/golang/go/issues/75804.
        run: go test -run '^$' -fuzz='^FuzzNativeInstallationReceipt$' -fuzztime=1000000x -timeout=5m -parallel=2 ./internal/netbirdinstall
      - name: Native NetBird ownership plist fuzzing
        run: go test -run '^$' -fuzz='^FuzzRemovalNativePlist$' -fuzztime=1000000x -timeout=5m -parallel=2 ./internal/netbirdinstall
      - name: Native NetBird loaded service ownership fuzzing
        run: go test -run '^$' -fuzz='^FuzzRemovalLaunchdOwnership$' -fuzztime=1000000x -timeout=5m -parallel=2 ./internal/netbirdinstall
      - name: Bounded Burn PE and UX container inspection
        run: go test -run '^$' -fuzz='^FuzzInspect$' -fuzztime=1000000x -timeout=5m -parallel=2 ./internal/burnbundle
      - name: Bounded Burn cabinet directory fuzzing
        run: go test -run '^$' -fuzz='^FuzzCabinetIndex$' -fuzztime=1000000x -timeout=5m -parallel=2 ./internal/burnbundle
      - name: Embedded Burn registration XML fuzzing
        run: go test -run '^$' -fuzz='^FuzzRegistration$' -fuzztime=1000000x -timeout=5m -parallel=2 ./internal/burnbundle
      - name: Bounded Windows kernel process snapshot decoder
        run: go test -run '^$' -fuzz='^FuzzSystemProcessCreation$' -fuzztime=1000000x -timeout=5m -parallel=2 ./internal/windowssoftware

  mac-storage:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CGO_CFLAGS: '-mmacosx-version-min=13.0'
      CGO_CXXFLAGS: '-mmacosx-version-min=13.0'
      CGO_LDFLAGS: '-mmacosx-version-min=13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Isolated noninteractive keychain and separate process recovery
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -tags openuem_keychain_test ./internal/enrollmentstore ./internal/agent ./internal/packagesignature ./internal/bootstrapinstall ./internal/enrollcommand ./internal/activatecommand ./internal/service/... ./internal/commands/sftp ./internal/commands/deploy ./internal/commands/netbird ./internal/netbirdjournal ./internal/netbirdinstall ./internal/commands/report ./internal/commands/runtime ./internal/runtimeoptions ./internal/macbundle ./internal/localready ./internal/macservice ./internal/machardware ./internal/macsecurity ./internal/windowssoftware ./internal/burnbundle
      - name: Root-only readiness over isolated native Unix sockets
        run: scripts/check-macos-readiness.sh
      - name: Root filesystem and read-only native activation fixtures
        run: scripts/check-macos-activation.sh
      - name: Build the agent with native keychain support
        env:
          CGO_ENABLED: '1'
        run: go build ./...
      - name: Build a draft app bundle from the actual agent without installing it
        run: scripts/check-macos-bundle.sh
      - name: Native enrollment help does not start the service
        run: |
          go run ./cmd/openuem-macos-bundle -help
          go run ./internal/service/mac enroll -help
          go run ./internal/service/mac serve -help
          go run ./internal/service/mac activate -help

  windows-storage:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Native DPAPI publication while the winner has an open reader
        run: go test -v -run '^TestWindowsPublishedRecordWithReadHandlePreservesExclusiveCreate$' ./internal/enrollmentstore
      - name: Native DPAPI concurrent readers retain independent access
        run: go test -v -run '^TestWindowsConcurrentProtectedRecordReaders$' ./internal/enrollmentstore
      - name: Repeat native DPAPI concurrent rotation admission
        run: go test -count=20 -timeout 2m -run '^TestWindowsDPAPIDurableRotationJournal$' ./internal/enrollmentstore
      - name: Native DPAPI, private publication and Local System recovery
        shell: pwsh
        run: |
          $packages = @('./internal/enrollmentstore', './internal/agent', './internal/packagesignature',
            './internal/bootstrapinstall', './internal/enrollcommand', './internal/activatecommand',
            './internal/service/...', './internal/commands/sftp', './internal/commands/deploy',
            './internal/commands/netbird', './internal/netbirdjournal', './internal/netbirdinstall',
            './internal/commands/report', './internal/commands/runtime',
            './internal/runtimeoptions', './internal/macbundle', './internal/localready',
            './internal/macservice', './internal/machardware', './internal/macsecurity',
            './internal/windowssoftware', './internal/burnbundle')
          # Compile in parallel, then isolate native fixture processes sharing disk/CPU.
          go test -run '^$' @packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Preserve goroutine stacks if one package hangs before the job limit.
          go test -p 1 -count=1 -timeout 3m @packages
      - name: Owned Windows package processes and observations execute without skips
        shell: pwsh
        run: |
          $events = go test -json -count=1 -run 'TestNativeWindowsWinGet|TestNativeWindowsPackage(Shutdown|Profile)|TestNativeWindowsSoftware' ./internal/commands/deploy ./internal/agent ./internal/windowssoftware
          $result = $LASTEXITCODE
          $events | Write-Output
          if ($result -ne 0) { exit $result }
          $records = $events | ForEach-Object { $_ | ConvertFrom-Json }
          $required = @(
            'TestNativeWindowsWinGetPreservesArgumentsAndExitCode',
            'TestNativeWindowsWinGetBoundsOutputAndRejectsStartup',
            'TestNativeWindowsWinGetCancellationJoinsOwnedTree',
            'TestNativeWindowsWinGetRejectsUnfinishedChildWithClosedOutput',
            'TestNativeWindowsWinGetOwnerExitTerminatesOwnedTree',
            'TestNativeWindowsPackageShutdownJoinsResultAndClosesAdmission',
            'TestNativeWindowsPackageProfileRejectsInvalidDataBeforeExecution',
            'TestNativeWindowsSoftwareRegistrationIsExactAndViewBound',
            'TestNativeWindowsSoftwareMSIAbsenceAndStrictHelper',
            'TestNativeWindowsSoftwareRejectsMalformedUTF16',
            'TestNativeWindowsSoftwareStagingExcludesWriteDeleteAndReplacement',
            'TestNativeWindowsSoftwareStagingVerifiesActualAuthenticodeWithoutExecution',
            'TestNativeWindowsSoftwareEXEArgumentsAndProcessFacts',
            'TestNativeWindowsSoftwareBurnUsesExactPinnedEXE',
            'TestNativeWindowsSoftwareCancellationPreservesUncertainty',
            'TestNativeWindowsSoftwareHostAndPECompatibility',
            'TestNativeWindowsSoftwareBootSession',
            'TestNativeWindowsSoftwareReconciliationReadOnlyHelper'
          )
          foreach ($test in $required) {
            if (-not ($records | Where-Object { $_.Test -eq $test -and $_.Action -eq 'pass' })) {
              throw "Required native package execution test did not pass: $test"
            }
          }
      - name: Install, upgrade and remove only generated synthetic MSIs on the ephemeral runner
        shell: pwsh
        run: scripts/check-windows-msi-execution.ps1 -Architecture amd64
      - name: Durable Windows software journal executes without skips
        shell: pwsh
        run: |
          $events = go test -json -count=1 -run '^TestWindowsDPAPI(DurableSoftwareJournal|DurableSoftwareReconciliation|SoftwareInventoryRejectsOrphanedEvidence)$' ./internal/enrollmentstore
          $result = $LASTEXITCODE
          $events | Write-Output
          if ($result -ne 0) { exit $result }
          $records = $events | ForEach-Object { $_ | ConvertFrom-Json }
          foreach ($test in @('TestWindowsDPAPIDurableSoftwareJournal', 'TestWindowsDPAPIDurableSoftwareReconciliation', 'TestWindowsDPAPISoftwareInventoryRejectsOrphanedEvidence')) {
            if (-not ($records | Where-Object { $_.Test -eq $test -and $_.Action -eq 'pass' })) {
              throw "Required native software journal test did not pass: $test"
            }
          }
      - name: Authenticated readiness and recovering SCM controller execute without skips
        shell: pwsh
        run: |
          $events = go test -json -count=1 -run 'TestNativeWindowsReadiness|TestNativeWindowsActivationRequiresSignedReadiness' ./internal/localready ./internal/activatecommand
          $result = $LASTEXITCODE
          $events | Write-Output
          if ($result -ne 0) { exit $result }
          $records = $events | ForEach-Object { $_ | ConvertFrom-Json }
          $required = @(
            'TestNativeWindowsReadinessBindsIdentityPIDAndSingleton',
            'TestNativeWindowsReadinessShutdownJoinsBorrowedSignerAndIdleClients',
            'TestNativeWindowsReadinessRejectsChangedPermissionsAndPartialAddress',
            'TestNativeWindowsReadinessRecoversAfterProcessExit',
            'TestNativeWindowsReadinessListenerShutdownSurvivesDisconnectedClients',
            'TestNativeWindowsActivationRequiresSignedReadinessFromTheSCMProcess'
          )
          foreach ($test in $required) {
            if (-not ($records | Where-Object { $_.Test -eq $test -and $_.Action -eq 'pass' })) {
              throw "Required native readiness test did not execute successfully: $test"
            }
          }
      - name: Build the agent
        run: go build ./...
      - name: Native enrollment help does not start the service
        run: |
          go run ./internal/service/windows enroll -help
          go run ./internal/service/windows serve -help
          go run ./internal/service/windows activate -help
