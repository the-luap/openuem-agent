name: Individual endpoint enrollment

on:
  pull_request:
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

jobs:
  linux-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Durable enrollment state and bounded HTTPS recovery
        run: go test -race -count=1 ./internal/enrollmentstore ./internal/agent
      - name: Build the agent
        run: go build ./...

  mac-storage:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Isolated noninteractive keychain and separate process recovery
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -tags openuem_keychain_test ./internal/enrollmentstore ./internal/agent
      - name: Build the agent with native keychain support
        env:
          CGO_ENABLED: '1'
        run: go build ./...

  windows-storage:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Native DPAPI, private publication and Local System recovery
        run: go test -count=1 ./internal/enrollmentstore ./internal/agent
      - name: Build the agent
        run: go build ./...
